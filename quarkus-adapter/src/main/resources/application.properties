quarkus.http.port=8081
quarkus.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

mp.messaging.outgoing.agent-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.agent-commands-out.topic=agent.commands.v1
mp.messaging.outgoing.agent-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.agent-commands-out.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.incoming.agent-workflow-events-in.connector=smallrye-kafka
mp.messaging.incoming.agent-workflow-events-in.topic=agent.workflow.events.v1
mp.messaging.incoming.agent-workflow-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.agent-workflow-events-in.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.agent-workflow-events-in.group.id=quarkus-output-adapter
mp.messaging.incoming.agent-workflow-events-in.auto.offset.reset=earliest

quarkus.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost:9042}
quarkus.cassandra.local-datacenter=${CASSANDRA_LOCAL_DATACENTER:datacenter1}
quarkus.cassandra.keyspace=agent

guardian.poll.enabled=${GUARDIAN_POLL_ENABLED:true}
guardian.poll.interval=${GUARDIAN_POLL_INTERVAL:10m}
guardian.poll.page-size=${GUARDIAN_POLL_PAGE_SIZE:50}
guardian.poll.max-pages=${GUARDIAN_POLL_MAX_PAGES:5}
guardian.api.key=${GUARDIAN_API_KEY:}
guardian.tenant-id=${GUARDIAN_TENANT_ID:tenant-default}

hackernews.api.base-url=${HACKERNEWS_API_BASE_URL:https://hacker-news.firebaseio.com}
hackernews.poll.enabled=${HACKERNEWS_POLL_ENABLED:true}
hackernews.poll.interval=${HACKERNEWS_POLL_INTERVAL:10m}
hackernews.poll.max-item-checks=${HACKERNEWS_POLL_MAX_ITEM_CHECKS:100}
hackernews.tenant-id=${HACKERNEWS_TENANT_ID:tenant-default}
