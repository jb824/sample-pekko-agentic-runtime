pekko {
  loglevel = "INFO"

  actor {
    provider = local

    serialization-bindings {
      "com.example.agent.runtime.checkpoint.WorkflowEntityActor$Command" = jackson-json
      "com.example.agent.runtime.checkpoint.WorkflowEntityActor$Event" = jackson-json
      "com.example.agent.runtime.checkpoint.WorkflowEntityActor$State" = jackson-json
      "com.example.agent.runtime.checkpoint.AgentCheckpoint" = jackson-json
      "com.example.agent.runtime.checkpoint.ContextManifest" = jackson-json
    }

    default-dispatcher {
      fork-join-executor {
        parallelism-min = 4
        parallelism-factor = 2.0
        parallelism-max = 16
      }
      throughput = 10
    }
  }

  persistence {
    journal.plugin = "pekko.persistence.cassandra.journal"
    snapshot-store.plugin = "pekko.persistence.cassandra.snapshot"

    cassandra {
      journal {
        keyspace = "pekko_agent_journal"
        keyspace-autocreate = true
        tables-autocreate = true
        contact-points = ["127.0.0.1:9042"]
        datacenter = "datacenter1"
      }
      snapshot {
        keyspace = "pekko_agent_snapshot"
        keyspace-autocreate = true
        tables-autocreate = true
        contact-points = ["127.0.0.1:9042"]
        datacenter = "datacenter1"
      }
    }
  }
}

agent {
  llm-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 4
    }
    throughput = 1
  }
}
