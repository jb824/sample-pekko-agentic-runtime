llm:
  backend: vllm
  temperature: 0.2
  context_window_tokens: 8192
  context_safety_tokens: 512
  ollama:
    base_url: http://localhost:11434
    model: granite4:3b
  vllm:
    base_url: http://localhost:8000/v1
    model: ibm-granite/granite-4.1-3b
    api_key: EMPTY
    api_type: chat
    max_tokens: 2048
    system_prompt: You are a careful assistant. Follow the user request exactly. Return complete, concise answers. Do not invent product names.
    tokenizer_path: ""
    grpc:
      host: localhost
      port: 50051
      plaintext: true
runtime:
  llm_threads: 4
  llm_queue_size: 32
  tool_threads: 4
  tool_queue_size: 64
  consumer_threads: 2
  consumer_queue_size: 1024
  task_retention_seconds: 900
  max_retained_tasks: 1000
  max_concurrent_requests: 128
  requests: 1
workflow:
  tools: time.now,arxiv.search
timeouts:
  llm_seconds: 90
  workflow_seconds: 180
  tool_seconds: 25
  consumer_processing_seconds: 30
prompts:
  default: Explain the formation of a tornado
  inline: ""
  file: ""
rag:
  enabled: false
  tenant_id: default
  collection: customer_profiles
  embedding:
    provider: in-memory
    model: simple-hash
    dimensions: 384
  vector_store: in-memory
  top_k: 5
  min_score: 0.0
  max_context_chars: 4000
  chunk:
    max_chars: 1200
    overlap_chars: 120
