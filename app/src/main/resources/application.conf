pekko {
  loglevel = "INFO"

  actor {
    provider = local

    default-dispatcher {
      fork-join-executor {
        parallelism-min = 4
        parallelism-factor = 2.0
        parallelism-max = 16
      }
      throughput = 10
    }
  }
}
app {
  mode = "kafka-runtime"
  workflow = "research"

  kafka {
    bootstrap-servers = "localhost:9092"
    input-topic = "agent.commands.v1"
    output-topic = "agent.workflow.events.v1"
    group-id = "pekko-agent-runtime"
  }
}
guardian {
  api {
    base-url = "https://content.guardianapis.com"
    key = ${?GUARDIAN_API_KEY}
    page-size = 20
    timeout = 10s
  }
}
vllm {
    model = "ibm-granite/granite-4.1-3b"
    base {
        url = "http://localhost:8000/v1"
    }
}
agent {
;     tools = "web.search,web.search"
;     workflow = "research"
}

